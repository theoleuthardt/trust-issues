name: trust-issues

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trustissues
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trust -d trustissues']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  verifier:
    build:
      context: .
      dockerfile: verifier/Containerfile
    environment:
      VERIFIER_TOKEN: ${VERIFIER_TOKEN:?set VERIFIER_TOKEN in .env}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      context: backend
      dockerfile: Containerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://trust:${POSTGRES_PASSWORD}@db:5432/trustissues
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      VERIFIER_URL: http://verifier:8081
      VERIFIER_TOKEN: ${VERIFIER_TOKEN}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      - db
      - verifier
    restart: unless-stopped
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
