[project]
name = "trust-issues-backend"
version = "0.0.0"
description = "Accounts, progress and verified leaderboard for Trust Issues"
requires-python = ">=3.13"
dependencies = [
  "litestar[jwt]>=2.16",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "argon2-cffi>=23.1",
  "httpx>=0.28",
  "msgspec>=0.19",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.26",
  "aiosqlite>=0.21",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trust_issues_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/trust_issues_backend/schemas.py" = ["S105"]
