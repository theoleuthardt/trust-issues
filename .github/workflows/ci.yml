name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend, simulation and verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated types match the committed schema
        run: |
          npm run api:types --workspace @trust-issues/frontend
          git diff --exit-code -- frontend/src/api/schema.d.ts

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trusttest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trust -d trusttest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://trust:ci-only-password@localhost:5432/trusttest
      - name: Committed OpenAPI schema matches the API
        run: |
          uv run python scripts/dump_openapi.py ../frontend/src/api/openapi.json
          git diff --exit-code -- ../frontend/src/api/openapi.json

  backup:
    name: Backup and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-backup-scripts.sh
      - run: bash scripts/test-check-health.sh
      - uses: astral-sh/setup-uv@v7
      - name: Start PostgreSQL and migrate it
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://trust:ci-only-password@localhost:5432/trustissues
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123
          VERIFIER_URL: http://localhost:8081
          VERIFIER_TOKEN: ci-only-verifier-token-0123456789abcd
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=trust -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=trustissues docker.io/library/postgres:17-alpine
          until docker exec pg pg_isready -U trust -d trustissues; do sleep 1; done
          uv sync --frozen
          uv run python -m trust_issues_backend.migrate
      - name: Back up, restore into a scratch database and compare
        env:
          DB_EXEC: docker exec -i pg
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          docker exec pg psql -U trust -d trustissues -c "INSERT INTO users (username, username_key, password_hash, token_version, created_at, failed_logins, is_admin, flagged) VALUES ('backup', 'backup', 'x', 0, now(), 0, false, false)"
          scripts/backup-db.sh
          scripts/restore-test.sh | tee restore.log
          grep -q '1 users' restore.log

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @trust-issues/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: uv sync --frozen
        working-directory: backend
      - run: ./scripts/smoke.sh

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v7
      - run: podman build -f frontend/Containerfile -t trust-issues-frontend .
      - run: podman build -f verifier/Containerfile -t trust-issues-verifier .
      - run: podman build -f backend/Containerfile -t trust-issues-backend backend
