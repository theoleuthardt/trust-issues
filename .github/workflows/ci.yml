name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend, simulation and verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trusttest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trust -d trusttest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://trust:ci-only-password@localhost:5432/trusttest

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @trust-issues/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: uv sync --frozen
        working-directory: backend
      - run: ./scripts/smoke.sh

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v7
      - run: podman build -f frontend/Containerfile -t trust-issues-frontend .
      - run: podman build -f verifier/Containerfile -t trust-issues-verifier .
      - run: podman build -f backend/Containerfile -t trust-issues-backend backend
