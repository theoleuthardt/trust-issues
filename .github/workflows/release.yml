name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
            file: frontend/Containerfile
          - name: verifier
            context: .
            file: verifier/Containerfile
          - name: backend
            context: backend
            file: backend/Containerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/theoleuthardt/trust-issues-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/theoleuthardt/trust-issues-${{ matrix.name }}:latest

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the release from the Conventional Commits since the last tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release-notes.sh "" "${{ github.ref_name }}" > notes.md
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md
