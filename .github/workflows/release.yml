name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
            file: frontend/Containerfile
          - name: verifier
            context: .
            file: verifier/Containerfile
          - name: backend
            context: backend
            file: backend/Containerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/theoleuthardt/trust-issues-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/theoleuthardt/trust-issues-${{ matrix.name }}:latest

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the release from the Conventional Commits since the last tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "" "$RELEASE_TAG" > notes.md
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file notes.md
          fi
