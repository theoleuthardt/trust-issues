name: Visual baselines

on:
  workflow_dispatch:
  push:
    branches: ['update-visual/**']

permissions:
  contents: read

jobs:
  render:
    name: Render the baselines
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run e2e:visual:update --workspace @trust-issues/e2e
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/tests/visual.spec.ts-snapshots
