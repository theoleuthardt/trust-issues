name: Epic
description: A themed bundle of features; the work itself lives in sub-issues
labels: [epic]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true for players or maintainers once this epic is done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, what is explicitly out.
    validations:
      required: true
