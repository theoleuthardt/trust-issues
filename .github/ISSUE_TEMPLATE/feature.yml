name: Feature
description: A single, shippable piece of work (usually a sub-issue of an epic)
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible afterwards, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements, one per line.
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, links, affected areas.
